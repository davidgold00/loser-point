[project]
name = "loserpoint"
version = "0.1.0"
description = "The Loser Point: How the NHL Pays Teams to Stop Playing Hockey — an empirical incentive-design analysis of the NHL point system."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16.0",
    "pandera>=0.19",
    "statsmodels>=0.14",
    "pyfixest>=0.24",
    "scikit-learn>=1.4",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "nhl-api-py>=1.2",
    "streamlit>=1.35",
    "plotly>=5.22",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "pre-commit>=3.7",
    "jupyter>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loserpoint"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/loserpoint --cov-report=term-missing"

[tool.coverage.report]
fail_under = 90
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
